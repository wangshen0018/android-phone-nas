<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机屏幕 · 家庭文件储存管理</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#dcdfe3;--pr:#2563eb;--ok:#16a34a;--dn:#dc2626}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}

header{background:var(--card);border-bottom:1px solid var(--bd);padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
.badge{font-size:11.5px;color:var(--mu);border:1px solid var(--bd);border-radius:10px;padding:1px 9px;white-space:nowrap}
.badge.on{color:var(--ok);border-color:#b7e4c7}
.badge.off{color:var(--dn);border-color:#f3c2c2}
.sp{flex:1}

button{font:13px/1.3 inherit;padding:6px 12px;border:1px solid var(--bd);border-radius:5px;background:#fff;color:var(--tx);cursor:pointer}
button:hover{border-color:#9db5e8;color:var(--pr)}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
button.primary:hover{background:#1d4ed8;color:#fff}
button.danger{color:var(--dn);border-color:#f3c2c2}
button.danger:hover{background:#fef2f2;border-color:var(--dn)}

.stage{flex:1;min-height:0;background:#111;position:relative}
.stage iframe{width:100%;height:100%;border:0;display:block;background:#111}
.blank{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#9aa3af;font-size:13px;text-align:center;padding:20px}
.blank.hide{display:none}
.blank b{color:#d6dbe2;font-size:15px;font-weight:600}
.blank span{max-width:520px;line-height:1.7}
.blank button{margin-top:8px;padding:8px 18px;font-size:13.5px}

.foot{background:var(--card);border-top:1px solid var(--bd);padding:6px 16px;font-size:11.5px;color:var(--mu);display:flex;gap:14px;flex-wrap:wrap}
.foot span{white-space:nowrap}
@media(max-width:760px){header h1{font-size:15px}}
</style>
</head>
<body>

<header>
  <h1>手机屏幕</h1>
  <span class="badge" id="badge">检查服务</span>
  <span class="sp"></span>
  <button class="primary" id="btnPower">启动投屏</button>
  <button id="btnReconnect" disabled>重新连接</button>
  <button id="btnNew" disabled>新标签打开</button>
</header>

<div class="stage">
  <iframe id="view" allow="autoplay; fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>
  <div class="blank" id="blank">
    <b>投屏服务未启动</b>
    <span>按需启用：点「启动投屏」会在手机上拉起编码进程，约 2 秒出画面。不用时点「停止服务」释放资源，平时不占内存也不发热。</span>
    <button class="primary" id="btnBlankOpen">启动投屏</button>
  </div>
</div>

<div class="foot">
  <span id="fState">状态：检查服务</span>
  <span id="fAddr"></span>
  <span>MSE 解码 · 1080×2400 · 点按即可反向操作</span>
</div>

<script>
const $ = id => document.getElementById(id);
const els = {view:$('view'), blank:$('blank'), badge:$('badge'), fState:$('fState'), fAddr:$('fAddr'),
             power:$('btnPower'), reconn:$('btnReconnect'), nw:$('btnNew'), blankBtn:$('btnBlankOpen')};

let power = false;      // 服务是否在运行
let busy  = false;      // 正在启停，防重复点击
let timer = null;

function streamUrl(){
  const host = location.hostname;
  const ws = 'ws://' + host + ':8886/';
  return '/remote/index.html#!action=stream'
       + '&udid=' + encodeURIComponent(host)
       + '&player=mse'
       + '&ws=' + encodeURIComponent(ws)
       + '&fitToScreen=true';
}

function setState(txt, cls){
  els.fState.textContent = '状态：' + txt;
  els.badge.textContent = txt;
  els.badge.className = 'badge' + (cls ? ' ' + cls : '');
}

/* 调后端启停接口；失败时返回 {ok:false,state:'stopped'}，不让页面卡死 */
async function api(a){
  try{
    const r = await fetch('cgi/scrcpy.cgi?a=' + a + '&_=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return {ok:false, state:'stopped', msg:'HTTP ' + r.status};
    return await r.json();
  }catch(e){
    return {ok:false, state:'stopped', msg:'请求失败'};
  }
}

function showBlank(title, msg, btnText){
  els.blank.classList.remove('hide');
  els.blank.querySelector('b').textContent = title;
  els.blank.querySelector('span').textContent = msg;
  els.blankBtn.textContent = btnText;
}

function connectView(){
  els.blank.classList.add('hide');
  els.view.src = streamUrl();
  setState('连接中','');
  clearTimeout(timer);
  timer = setTimeout(() => {
    if(els.badge.textContent === '连接中'){
      setState('未连上 8886','off');
      els.fState.textContent = '状态：8886 无响应，服务可能刚被停止或启动失败';
    }
  }, 9000);
}

function stopView(keepBlank){
  els.view.src = 'about:blank';
  clearTimeout(timer);
  if(keepBlank) els.blank.classList.remove('hide');
}

function syncBtns(){
  els.power.disabled = busy;
  els.reconn.disabled = busy || !power;
  els.nw.disabled = busy || !power;
  if(busy) return;
  if(power){
    els.power.textContent = '停止服务';
    els.power.classList.remove('primary');
    els.power.classList.add('danger');
  }else{
    els.power.textContent = '启动投屏';
    els.power.classList.add('primary');
    els.power.classList.remove('danger');
  }
}

/* 进页面先问一次服务状态，不盲目连 */
async function probe(){
  busy = true; syncBtns();
  setState('检查服务…','');
  const j = await api('status');
  power = (j.state === 'running');
  busy = false;
  if(power){
    connectView();
  }else{
    stopView(false);
    showBlank('投屏服务未启动',
      '按需启用：点「启动投屏」会在手机上拉起编码进程，约 2 秒出画面。不用时点「停止服务」释放资源，平时不占内存也不发热。',
      '启动投屏');
    setState('服务未启动','off');
  }
  syncBtns();
}

/* 启动或停止服务 */
async function togglePower(){
  if(busy) return;
  const wantStart = !power;
  busy = true; syncBtns();
  setState(wantStart ? '正在启动…' : '正在停止…','');

  const j = await api(wantStart ? 'start' : 'stop');
  power = (j.state === 'running');
  busy = false;

  if(!j.ok && wantStart){
    setState('启动失败','off');
    stopView(false);
    showBlank('启动失败', (j.msg || '未知错误') + '。可稍后重试，或到 K40 上执行 scrcpy-serve.sh status 查看日志。', '重试启动');
  }else if(power){
    connectView();
  }else{
    stopView(false);
    showBlank('投屏服务已停止',
      '编码进程已退出，手机不再占用编码资源。需要看画面时点「启动投屏」即可。',
      '启动投屏');
    setState('服务已停止','');
  }
  syncBtns();
}

els.power.onclick   = togglePower;
els.reconn.onclick  = connectView;
els.nw.onclick      = () => window.open(streamUrl(), '_blank');
els.blankBtn.onclick = () => {
  if(power) connectView(); else togglePower();
};
els.view.onload = () => {
  const s = els.view.getAttribute('src') || '';
  if(s && s.indexOf('/remote/index.html') === 0) setState('已连接','on');
};

els.fAddr.textContent = 'ws://' + location.hostname + ':8886';
probe();
</script>
</body>
</html>
