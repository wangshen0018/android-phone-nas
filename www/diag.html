<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEVC 播放黑屏诊断</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#15181c;color:#d7dbe0;font:14px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:20px}
h1{font-size:17px;margin:0 0 4px}
.sub{color:#8b929a;font-size:12px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid #262b31;text-align:left;vertical-align:top}
th{color:#8b929a;font-weight:400;width:38%}
td{font-family:Consolas,monospace;word-break:break-all}
.ok{color:#7fbf7f}.bad{color:#f08a8a}.warn{color:#d8b25c}
h2{font-size:14px;margin:22px 0 8px;color:#aeb6c0;border-left:3px solid #3b414a;padding-left:8px}
video,canvas{border:1px solid #2b3138;border-radius:4px;max-width:100%;display:block;margin-top:6px}
.tag2{display:inline-block;padding:1px 7px;border:1px solid #3b414a;border-radius:3px;font-size:12px;color:#8b929a;margin-left:6px}
</style>
</head>
<body>
<h1>HEVC 播放黑屏诊断</h1>
<div class="sub">本页只做检测，不改动任何数据。检测对象：VID_20251231_194100.mp4（H.265 · 1.8 MB · 1080×1440 · 8bit）</div>

<h2>一、浏览器与解码能力</h2>
<table id="t1"></table>

<h2>二、Blob 方式播放（判定页当前用的方式）</h2>
<table id="t2"></table>
<div id="v1"></div>

<h2>三、原生 src 方式播放（对照）</h2>
<table id="t3"></table>
<div id="v2"></div>

<h2>四、系统侧对照</h2>
<div class="sub" style="line-height:2">
如果上面两项都显示「有帧输出但画面亮度为 0」，说明解码正常、是渲染链路把画面丢了。<br>
此时请用 Windows 自带「电影和电视」打开同一段视频：<b>能看 → 证实是浏览器渲染问题；也黑 → 是显卡驱动/解码器问题</b>。<br>
下载地址：<a href="media/ce9d0c3f8d3c8f1c.mp4" download style="color:#7aa7ff">ce9d0c3f8d3c8f1c.mp4</a>（右键另存）
</div>

<script>
const ID='ce9d0c3f8d3c8f1c', EXT='mp4';
const URL_MEDIA='media/'+ID+'.'+EXT;
const $=s=>document.querySelector(s);
function row(tb,k,v,cls){
  const tr=document.createElement('tr');
  tr.innerHTML=`<th>${k}</th><td class="${cls||''}">${v}</td>`;
  document.getElementById(tb).appendChild(tr);
}

/* ── 一、能力 ── */
(function(){
  const v=document.createElement('video');
  const hvc1=v.canPlayType('video/mp4; codecs="hvc1.1.6.L120.90"');
  const hev1=v.canPlayType('video/mp4; codecs="hev1.1.6.L120.90"');
  const avc =v.canPlayType('video/mp4; codecs="avc1.640028"');
  let ms='';
  try{ ms=MediaSource.isTypeSupported('video/mp4; codecs="hvc1.1.6.L120.90"')?'true':'false'; }catch(e){ ms='异常 '+e.message; }
  row('t1','浏览器', navigator.userAgent.replace(/^.*(Edg|Chrome)\/([\d.]+).*$/,'$1/$2'));
  row('t1','canPlayType hvc1', hvc1||'（空 = 不支持）', hvc1?'ok':'bad');
  row('t1','canPlayType hev1', hev1||'（空 = 不支持）', hev1?'ok':'bad');
  row('t1','canPlayType avc1', avc||'（空）', avc?'ok':'bad');
  row('t1','MediaSource.isTypeSupported(hvc1)', ms, ms==='true'?'ok':'bad');
  row('t1','硬件加速（WebGL 渲染器）', (()=>{try{const c=document.createElement('canvas');const g=c.getContext('webgl');const d=g.getExtension('WEBGL_debug_renderer_info');return d?g.getParameter(d.UNMASKED_RENDERER_WEBGL):'（不可用）';}catch(e){return '异常';}})());
})();

/* ── 通用：采集一帧的实际状态（含取帧亮度） ── */
function collect(video,tb){
  const o={};
  const q=video.getVideoPlaybackQuality?video.getVideoPlaybackQuality():{};
  o.videoWidth=video.videoWidth||0; o.videoHeight=video.videoHeight||0;
  o.currentTime=+(video.currentTime||0).toFixed(2);
  o.readyState=video.readyState;
  o.error=video.error?('code '+video.error.code+' '+(video.error.message||'')):'none';
  o.totalVideoFrames=q.totalVideoFrames!=null?q.totalVideoFrames:null;
  o.droppedVideoFrames=q.droppedVideoFrames!=null?q.droppedVideoFrames:null;
  o.avgLuma=null; o.maxLuma=null;
  try{
    const W=160,H=Math.max(1,Math.round(160*(o.videoHeight||1440)/(o.videoWidth||1080)));
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const g=c.getContext('2d',{willReadFrequently:true});
    g.drawImage(video,0,0,W,H);
    const px=g.getImageData(0,0,W,H).data;
    let sum=0,n=0,maxv=0;
    for(let i=0;i<px.length;i+=16){const l=(px[i]+px[i+1]+px[i+2])/3;sum+=l;n++;if(l>maxv)maxv=l;}
    o.avgLuma=+(sum/n).toFixed(1); o.maxLuma=maxv;
    c.style.cssText='border:1px solid #2b3138;max-width:160px;margin-top:6px';
    document.getElementById(tb==='t2'?'v1':'v2').appendChild(c);
  }catch(e){ o.drawErr=e.message; }

  row(tb,'videoWidth × videoHeight', o.videoWidth+' × '+o.videoHeight, o.videoWidth>0?'ok':'bad');
  row(tb,'currentTime', o.currentTime+' s');
  row(tb,'readyState', o.readyState+'（4=可播）');
  row(tb,'error', o.error, o.error==='none'?'ok':'bad');
  row(tb,'已解码帧数 totalVideoFrames', o.totalVideoFrames==null?'（不支持该 API）':o.totalVideoFrames,
      o.totalVideoFrames>0?'ok':'bad');
  row(tb,'丢帧 droppedVideoFrames', o.droppedVideoFrames==null?'-':o.droppedVideoFrames);
  row(tb,'画面平均亮度 (0–255)', o.avgLuma==null?'取帧失败':(o.avgLuma+'　最大 '+o.maxLuma),
      o.avgLuma>8?'ok':'bad');
  row(tb,'判定', o.avgLuma>8?'画面有内容，渲染正常'
      :(o.totalVideoFrames>0?'<b>解码帧存在但输出全黑</b>':'<b>没有任何帧被解码</b>'),'bad');
  return o;
}

/* 等播放推进到 1.2 秒（或超时/结束）再采样，避免采到解码前的空帧 */
function waitPlayed(video,ms){
  return new Promise(res=>{
    const t0=Date.now();
    (function tick(){
      if(video.currentTime>1.2||video.ended||video.error||Date.now()-t0>ms) return res();
      setTimeout(tick,250);
    })();
  });
}

const RESULT={};
function report(){
  fetch('cgi/report.cgi',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(RESULT)}).then(r=>r.json()).then(j=>{
      const d=document.createElement('div');
      d.style.cssText='margin-top:18px;padding:10px;border:1px solid #2b4a2b;border-radius:4px;color:#7fbf7f;font-size:13px';
      d.textContent='结果已上报到 K40（'+new Date().toLocaleTimeString()+'），不用截图，直接等回复即可。';
      document.body.appendChild(d);
    }).catch(e=>{
      const d=document.createElement('div');
      d.style.cssText='margin-top:18px;color:#f08a8a;font-size:13px';
      d.textContent='上报失败：'+e.message;
      document.body.appendChild(d);
    });
}

function runBlob(){
  const video=document.createElement('video');
  video.controls=true; video.muted=true; video.playsInline=true;
  video.style.cssText='max-width:240px;margin-top:6px';
  document.getElementById('v1').appendChild(video);
  video.onerror=()=>row('t2','video.onerror 触发','已触发，code='+(video.error&&video.error.code),'bad');
  fetch(URL_MEDIA).then(r=>r.blob()).then(b=>{
    RESULT.blobSize=b.size; RESULT.blobType=b.type||'';
    row('t2','Blob 大小', b.size+' B · type='+(b.type||'（空）'), b.size>0?'ok':'bad');
    video.src=URL.createObjectURL(b);
    return video.play().catch(e=>{ RESULT.blobPlayErr=e.name+': '+e.message;
      row('t2','play() 被拒', e.name+': '+e.message,'warn'); });
  }).then(()=>waitPlayed(video,9000)).then(()=>{
    RESULT.blob=collect(video,'t2');
  }).catch(e=>row('t2','加载失败', e.message,'bad'));
}

function runNative(){
  const video=document.createElement('video');
  video.controls=true; video.muted=true; video.playsInline=true;
  video.style.cssText='max-width:240px;margin-top:6px';
  document.getElementById('v2').appendChild(video);
  video.onerror=()=>{
    const c=video.error&&video.error.code;
    RESULT.nativeErrCode=c;
    row('t3','video.onerror 触发','code '+c+'（4=SRC_NOT_SUPPORTED 表示 MIME 或编码被拒）','bad');
  };
  video.src=URL_MEDIA;
  video.play().catch(e=>{ RESULT.nativePlayErr=e.name+': '+e.message;
    row('t3','play() 被拒', e.name+': '+e.message,'warn'); });
  waitPlayed(video,6000).then(()=>{
    RESULT.native=collect(video,'t3');
  });
}

RESULT.canPlay={
  hvc1:document.createElement('video').canPlayType('video/mp4; codecs="hvc1.1.6.L120.90"'),
  hev1:document.createElement('video').canPlayType('video/mp4; codecs="hev1.1.6.L120.90"'),
  avc1:document.createElement('video').canPlayType('video/mp4; codecs="avc1.640028"')
};
RESULT.gpu=(()=>{try{const g=document.createElement('canvas').getContext('webgl');
  const d=g.getExtension('WEBGL_debug_renderer_info');
  return d?g.getParameter(d.UNMASKED_RENDERER_WEBGL):'unavailable';}catch(e){return 'err';}})();

runBlob();
setTimeout(runNative, 5000);
setTimeout(report, 17000);
</script>
</body>
</html>
