<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家庭文件储存管理</title>
<style>
:root{
  --bg:#f6f7f8;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#dcdfe3;--pr:#2563eb;--dn:#dc2626;
  --nav:#1f2430;--navtx:#c3c9d4;--navact:#2f3646;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}

/* 左侧导航 */
#nav{
  position:fixed;left:0;top:0;bottom:0;width:208px;background:var(--nav);color:var(--navtx);
  display:flex;flex-direction:column;z-index:20;
}
#nav .brand{padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#nav .brand b{color:#fff;font-size:15px;display:block;line-height:1.35}
#nav .brand small{color:#8a93a3;font-size:11.5px;display:block;margin-top:3px}
#nav .items{padding:10px 0;flex:1;overflow:auto}
#nav .it{
  display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;
  color:var(--navtx);font-size:13.5px;border-left:3px solid transparent;user-select:none;
}
#nav .it:hover{background:rgba(255,255,255,.05);color:#fff}
#nav .it.act{background:var(--navact);color:#fff;border-left-color:var(--pr);font-weight:600}
#nav .it .ic{width:20px;text-align:center;font-size:15px;opacity:.9;flex-shrink:0}
#nav .it .bdg{
  margin-left:auto;background:#dc2626;color:#fff;font-size:10.5px;padding:1px 6px;
  border-radius:9px;font-variant-numeric:tabular-nums;display:none;
}
#nav .it .bdg.on{display:inline-block}
#nav .foot{padding:11px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#7d8798;line-height:1.7}
#nav .foot span{display:block}
#nav .foot b{color:#c3c9d4;font-weight:600;font-variant-numeric:tabular-nums}

/* 内容区 */
#main{margin-left:208px;height:100%;display:flex;flex-direction:column}
#frame{flex:1;width:100%;border:0;background:var(--bg)}

/* 移动端：横条导航 */
@media(max-width:760px){
  #nav{position:static;width:100%;height:auto;flex-direction:row;flex-wrap:wrap}
  #nav .brand{width:100%;padding:11px 15px 9px;border-bottom:1px solid rgba(255,255,255,.08)}
  #nav .items{display:flex;padding:0;flex:1;overflow-x:auto}
  #nav .it{padding:9px 13px;border-left:0;border-bottom:3px solid transparent;white-space:nowrap;font-size:13px}
  #nav .it.act{border-left:0;border-bottom-color:var(--pr)}
  #nav .it .ic{display:none}
  #nav .foot{display:none}
  #main{margin-left:0}
  html,body{overflow:auto}
  #main{height:calc(100vh - 108px)}
}
</style>
</head>
<body>

<nav id="nav">
  <div class="brand">
    <b>家庭文件储存管理</b>
    <small>K40 · <K40_LAN_IP></small>
  </div>
  <div class="items" id="items"></div>
  <div class="foot">
    <span>待判 <b id="fPending">—</b> · 已存档 <b id="fArchive">—</b></span>
    <span>剩余空间 <b id="fDisk">—</b></span>
  </div>
</nav>

<div id="main">
  <iframe id="frame" src="/judge.html" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
</div>

<script>
const PAGES=[
  {id:'judge',   name:'文件判定',    icon:'🖼',  url:'/judge.html',   badge:'pending'},
  {id:'archive', name:'存档管理',    icon:'📦',  url:'/archive.html'},
  {id:'magnet',  name:'磁力搜索',    icon:'🧲',  url:'/magnet/index.html'},
  {id:'down',    name:'下载管理',    icon:'⬇',  url:'/ariang-setup.html'},
  {id:'network', name:'网络服务管理', icon:'🌐',  url:'/network.html'},
  {id:'screen',  name:'手机屏幕',    icon:'📱',  url:'/screen.html'},
  {id:'stats',   name:'统计',        icon:'📊',  url:'/stats.html'},
];

let cur=null;
const itemsEl=document.getElementById('items');
const frame=document.getElementById('frame');

function renderNav(){
  itemsEl.innerHTML=PAGES.map(p=>`
    <div class="it${p.id===cur?' act':''}" data-id="${p.id}" data-url="${p.url}">
      <span class="ic">${p.icon}</span>
      <span>${p.name}</span>
      ${p.badge?'<span class="bdg" id="bdg-'+p.id+'"></span>':''}
    </div>`).join('');
  itemsEl.querySelectorAll('.it').forEach(el=>{
    el.onclick=()=>go(el.dataset.id, el.dataset.url);
  });
}

/* busybox httpd 对 .html 不发 Cache-Control，浏览器走启发式缓存，
   页面更新后不硬刷就拿旧版（判定页"没按钮"的实际原因）。
   iframe 每次装载都带时间戳参数，彻底绕开 HTML 缓存。
   查询参数不影响页面内相对路径（media/、cgi/ 仍按目录解析）。 */
const bust=u=>u+(u.includes('?')?'&':'?')+'_='+Date.now();

function go(id,url){
  if(cur===id) return;
  cur=id;
  renderNav();
  frame.src=bust(url);
  try{ history.replaceState(null,'','#'+id); }catch(e){}
}

// 状态摘要（每 30 秒拉一次）
let LAST={};
async function pullSummary(){
  try{
    const r=await fetch('/cgi/status.cgi',{cache:'no-store'});
    const j=await r.json();
    if(!j.ok) return;
    LAST=j;
    // 待判数量角标
    const pend=(j.judge&&j.judge.pending)||0;
    const bdg=document.getElementById('bdg-judge');
    if(bdg){ bdg.textContent=pend>999?'999+':pend; bdg.classList.toggle('on',pend>0); }
    document.getElementById('fPending').textContent=pend||0;
    document.getElementById('fArchive').textContent=(j.files&&j.files.archiveN)||0;
    const d=j.disk||{};
    const avail=Number(d.avail||0);
    document.getElementById('fDisk').textContent=avail?(avail/1073741824).toFixed(0)+' GB':'—';
  }catch(e){}
}

// 子页面可通过 postMessage 通知切换
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='go'){ const p=PAGES.find(x=>x.id===d.id); if(p) go(p.id,p.url); }
  if(d.type==='refreshSummary') pullSummary();
});

// 初始化
const hash=(location.hash||'').replace('#','');
const init=PAGES.find(p=>p.id===hash)||PAGES[0];
cur=init.id; renderNav(); frame.src=bust(init.url);
pullSummary();
setInterval(pullSummary,30000);
</script>
</body>
</html>
