<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>存档管理 · 家庭文件储存管理</title>
<script src="pinyin.js"></script>
<style>
:root{--bg:#f6f7f8;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#dcdfe3;--pr:#2563eb;--dn:#dc2626;--wn:#d97706}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px}
.h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.h1 b{font-size:15px}
.h1 a{color:var(--pr);text-decoration:none;font-size:13px}
.h1 a:hover{text-decoration:underline}
.stat{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--bd);background:#fff;color:var(--tx);padding:5px 11px;border-radius:4px;font-size:13px;cursor:pointer}
.btn:hover{border-color:#b9bec4}
.btn.pr{border-color:var(--pr);color:var(--pr)}
.btn.dn{border-color:var(--dn);color:var(--dn)}
.btn.wn{border-color:var(--wn);color:var(--wn)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:3px 8px;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:14px}

/* 类型-年份 折叠分组 */
.grp{margin-bottom:16px}
.grph{display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;
  background:#dfe4ea;border:1px solid #c8cfd8;border-radius:7px;user-select:none}
.grph:hover{background:#d6dce4}
.grph .arw{width:14px;color:#5b6472;font-size:12px;transition:transform .15s;display:inline-block}
.grp.open .grph .arw{transform:rotate(90deg)}
.grph .tp{font-weight:700;font-size:13.5px;color:#22303f}
.grph .yr{font-size:12px;color:#fff;background:#5b6472;border-radius:3px;padding:1px 7px;font-variant-numeric:tabular-nums}
.grph .sm{margin-left:auto;font-size:12px;color:#5b6472;font-variant-numeric:tabular-nums;white-space:nowrap}
.grgb{display:none;padding:12px 0 0}
.grp.open .grgb{display:block}

/* 事件夹卡片 */
.ev{background:var(--card);border:1px solid var(--bd);border-radius:7px;margin-bottom:12px;overflow:hidden}
/* 双列：事件夹卡排两轨；展开的那张跨满整行（缩略图网格需要宽度）；
   窄屏自动回单轨。列内对齐靠 grid-auto-flow:dense 补空隙 */
body.cols2 .evlist{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start;grid-auto-flow:row dense}
body.cols2 .evlist>.ev.open{grid-column:1/-1}
body.cols2 .evh{padding:8px 11px;gap:8px}
body.cols2 .evh .fn{font-size:12.5px;min-width:120px}
@media(max-width:1150px){
  body.cols2 .evlist{grid-template-columns:1fr}
}
#colBtn{white-space:nowrap}
.evh{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#eef0f2;cursor:pointer;flex-wrap:wrap}
.evh:hover{background:#e7eaed}
.evh .arw{width:14px;color:var(--mu);font-size:12px;transition:transform .15s}
.ev.open .evh .arw{transform:rotate(90deg)}
.evh .fn{font-weight:600;font-size:13.5px;word-break:break-all;flex:1;min-width:180px}
.evh .ym{font-size:11.5px;color:var(--mu);border:1px solid var(--bd);border-radius:3px;padding:0 5px;background:#fff}
.evh .cnt{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.evh .lz{font-size:11.5px;color:#9aa1a9;font-variant-numeric:tabular-nums;white-space:nowrap;border:1px solid #dde1e6;
  border-radius:3px;padding:0 5px;background:#fff}
.evh .acts{display:flex;gap:6px}
.evb{display:none;padding:10px 13px 13px}
.ev.open .evb{display:block}

/* 缩略图网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.it{position:relative;background:#eef0f2;border:1px solid var(--bd);border-radius:5px;overflow:hidden;aspect-ratio:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.it img{width:100%;height:100%;object-fit:cover;display:block}
.it.picked{border:2px solid var(--pr);box-shadow:0 0 0 2px rgba(37,99,235,.18)}
.it .vf{font-size:22px;color:#9aa1a9;flex-direction:column;display:flex;align-items:center;gap:2px}
.it .vf small{font-size:10px;color:var(--mu)}
/* 勾选框：左下角，专门负责"选中"，跟"点开看"分开。
   以前整张卡点一下就是选中，想看大图没有入口，这是被吐槽的主要点。 */
.it .ck{position:absolute;left:4px;top:4px;z-index:2;width:17px;height:17px;border-radius:4px;
  background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.22);color:transparent;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;line-height:1;cursor:pointer}
.it .ck:hover{background:#fff;border-color:var(--pr)}
.it.picked .ck{background:var(--pr);border-color:var(--pr);color:#fff}
.it .nm{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:10px;padding:8px 4px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.it.selmode .nm{display:none}

/* 空态 */
.empty{text-align:center;color:var(--mu);padding:40px 0;font-size:13px}

/* 底部批量条 */
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;background:#1a1d21;color:#fff;
  border-radius:8px;padding:9px 14px;display:none;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-size:13px;flex-wrap:wrap}
.bulkbar.on{display:flex}
.bulkbar b{font-variant-numeric:tabular-nums}
.bulkbar .btn{background:transparent;border-color:#4a4f56;color:#e8eaed;padding:5px 10px;font-size:12.5px}
.bulkbar .btn:hover{border-color:#8a9099;background:#262a2f}
.bulkbar .btn.dn{border-color:#7f1d1d;color:#fca5a5}
.bulkbar .btn.pr{border-color:#1e40af;color:#93c5fd}

/* 模态框 */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center}
.modal.on{display:flex}
.modal .bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.modal .box{position:relative;background:#fff;border-radius:9px;width:min(92vw,480px);max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.28);overflow:hidden}
.modal .hd{padding:13px 16px;border-bottom:1px solid var(--bd);font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px}
.modal .bd2{padding:14px 16px;overflow:auto}
.modal .ft{padding:11px 16px;border-top:1px solid var(--bd);display:flex;gap:9px;justify-content:flex-end;background:#fafbfc}
.modal .x{margin-left:auto;background:none;border:none;font-size:17px;color:var(--mu);cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1}
.modal .x:hover{background:#f0f2f4;color:var(--tx)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:4px}
.fld input,.fld select{width:100%;font:13px inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:4px;background:#fff;color:var(--tx)}
.tip{font-size:12px;color:var(--mu);line-height:1.7;background:#f8f9fa;border-left:3px solid var(--bd);padding:8px 10px;border-radius:3px;margin-bottom:12px}
.tip b{color:var(--wn)}

/* 图形化事件选择器 */
.modal .box.wide{width:min(94vw,760px)}
.pkbar{display:flex;gap:8px;margin-bottom:10px}
.pkbar input{flex:1;font:13px inherit;padding:6px 9px;border:1px solid var(--bd);border-radius:4px;background:#fff;color:var(--tx)}
.pkbar input:focus{outline:none;border-color:var(--pr)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:#fff;color:#4b5563;border-radius:14px;padding:3px 11px;
  font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{border-color:#b9bec4;background:#f9fafb}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;
  max-height:44vh;overflow:auto;padding:2px;align-content:start;align-items:start}
.pk{border:1px solid var(--bd);border-radius:7px;overflow:hidden;cursor:pointer;background:#fff;
  display:flex;flex-direction:column;transition:border-color .12s,box-shadow .12s}
.pk:hover{border-color:#b9bec4}
.pk.on{border-color:var(--pr);box-shadow:0 0 0 2px rgba(37,99,235,.18)}
.pk .cv{position:relative;padding-top:75%;background:#eef0f2;overflow:hidden}
.pk .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pk .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#a8b0b9;background:#eef0f2}
.pk .tx{padding:6px 8px 8px;min-height:0}
.pk .tp2{font-size:12.5px;font-weight:600;line-height:1.35;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pk .mt{font-size:11px;color:var(--mu);margin-top:3px;display:flex;gap:5px;align-items:center;
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
.pk .tg{font-size:10.5px;color:#4b5563;background:#eef0f2;border-radius:3px;padding:0 5px}
.pk .lz{font-size:10.5px;color:#9aa1a9}
.pk .lz.old{color:#b45309}
.pksel{font-size:12.5px;color:var(--mu);margin-right:auto;align-self:center;
  max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pksel b{color:var(--pr)}
.pknone{grid-column:1/-1;text-align:center;color:var(--mu);padding:26px 0;font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:300;background:#1a1d21;color:#fff;
  padding:9px 18px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
#toast.err{background:#991b1b}

/* ---- 年份折叠条 ----
   原来年份只是类型分组里的一行小字，看得见但点不动。
   现在做成可折叠：整年收起后只留标题，事件的量和体积一眼可比较。 */
.yrbar{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#3f4956;font-weight:700;
  padding:7px 9px 6px;margin:2px 0 6px;cursor:pointer;user-select:none;border-radius:5px;
  background:#f2f4f6;border:1px solid #e2e6ea}
.yrbar:hover{background:#eceff2}
.yrbar .arw{width:11px;color:#6b7280;font-size:10px;transition:transform .15s;display:inline-block}
.yrbar.closed .arw{transform:rotate(-90deg)}
.yrbar .n{font-weight:400;color:#7b8494;font-variant-numeric:tabular-nums}
.yrbar .cl{color:#9aa1a9;font-size:11px;font-weight:400;margin-left:auto}
.evwrap.closed .evlist{display:none}

/* ---- 存入批次分组 ----
   同一事件里的文件可能分好几次存进来（第一次 30 张、隔天补 10 张）。
   按回执里的归档时刻分组，才能看出"这批是什么时候进的"。 */
.bat{margin-bottom:13px}
.bath{display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:600;color:#4b5563;
  padding:0 0 7px;margin-bottom:8px;border-bottom:1px dashed #d8dce1}
.bath .bts{color:#1f2937}
.bath .n{font-weight:400;color:#7b8494;font-variant-numeric:tabular-nums}
.bath .tag{font-size:10.5px;font-weight:400;color:#9aa1a9;border:1px solid #e2e6ea;border-radius:3px;padding:0 5px}

/* ---- 卡片上的时间与播放角标 ---- */
.it .dt{position:absolute;right:4px;bottom:17px;font-size:9.5px;line-height:1.5;color:#fff;
  background:rgba(0,0,0,.5);border-radius:3px;padding:0 4px;pointer-events:none;
  font-variant-numeric:tabular-nums;letter-spacing:.2px}
.it .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32px;height:32px;
  border-radius:50%;background:rgba(0,0,0,.52);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:13px;padding-left:2px;pointer-events:none;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.it:hover .pl{background:rgba(37,99,235,.85)}

/* ---- 全屏预览 / 播放 ---- */
#pv{position:fixed;inset:0;z-index:260;display:none;background:rgba(0,0,0,.9)}
#pv.on{display:flex;align-items:center;justify-content:center}
#pv img,#pv video{max-width:96vw;max-height:90vh;object-fit:contain;background:#000;display:block}
#pv .pvh{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:10px 16px;color:#e8eaed;font-size:12.5px;background:linear-gradient(rgba(0,0,0,.62),transparent)}
#pv .pvh .f1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pv .pvh .x{background:none;border:none;color:#e8eaed;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
#pv .pvh .x:hover{color:#fff}
#pv .pvf{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#c7ccd3;font-size:11.5px}
#pv .pvn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;
  background:rgba(255,255,255,.1);border:none;color:#fff;font-size:26px;line-height:1;cursor:pointer;
  border-radius:6px;display:flex;align-items:center;justify-content:center}
#pv .pvn:hover{background:rgba(255,255,255,.22)}
#pv #pvPrev{left:10px}
#pv #pvNext{right:10px}
#pvBody img{cursor:zoom-in}

</style>
</head>
<body>
<header>
  <div class="h1">
    <b>已存档管理</b>
    <span class="stat" id="hstat">加载中…</span>
    <span style="flex:1"></span>
    <button class="btn sm" id="batchBtn" title="切换事件内分批依据">按存入时间</button>
    <button class="btn sm" id="colBtn" title="切换单列/双列显示">双列</button>
    <a href="/">← 返回导航</a>
    <button class="btn sm" onclick="loadAll()">刷新</button>
    <button class="btn sm pr" onclick="openNewEvent()">新建事件</button>
  </div>
</header>

<main id="list"><div class="empty">加载中…</div></main>

<div class="bulkbar" id="bulkbar">
  <span>已选 <b id="pkn">0</b> 项</span>
  <button class="btn pr" id="bkmove">移到事件</button>
  <button class="btn wn" id="bkren">批量重命名</button>
  <button class="btn dn" id="bkdel">移入回收区</button>
  <button class="btn" id="bkclear">清空</button>
</div>

<!-- 重命名模态框 -->
<div class="modal" id="mRen">
  <div class="bg" onclick="closeM('mRen')"></div>
  <div class="box">
    <div class="hd">重命名<button class="x" onclick="closeM('mRen')">×</button></div>
    <div class="bd2">
      <div class="tip" id="renTip"></div>
      <div class="fld">
        <label id="renLbl">新名称</label>
        <input id="renInput" placeholder="输入新名称">
      </div>
    </div>
    <div class="ft">
      <button class="btn" onclick="closeM('mRen')">取消</button>
      <button class="btn pr" id="renOk">确定</button>
    </div>
  </div>
</div>

<!-- 移到事件模态框（图形化选择器） -->
<div class="modal" id="mMove">
  <div class="bg" onclick="closeM('mMove')"></div>
  <div class="box wide">
    <div class="hd">移动到事件<button class="x" onclick="closeM('mMove')">×</button></div>
    <div class="bd2">
      <div class="tip" id="mvTip"></div>
      <div class="pkbar">
        <input id="mvQ" placeholder="搜索事件名 / 主题 / 日期 / 拼音首字母，如 视察、2026-10、hhgclh">
        <button class="btn pr" onclick="openNewEvent(true)">＋ 新建</button>
      </div>
      <div class="chips" id="mvCats"></div>
      <div class="pkgrid" id="mvGrid"></div>
    </div>
    <div class="ft">
      <span class="pksel" id="mvPicked">未选择目标事件</span>
      <button class="btn" onclick="closeM('mMove')">取消</button>
      <button class="btn pr" id="mvOk" disabled>确定移动</button>
    </div>
  </div>
</div>

<!-- 新建事件模态框 -->
<div class="modal" id="mNew">
  <div class="bg" onclick="closeM('mNew')"></div>
  <div class="box">
    <div class="hd">新建事件夹<button class="x" onclick="closeM('mNew')">×</button></div>
    <div class="bd2">
      <div class="tip">夹名格式为 <b>日期_分类_主题</b>，例如 <code>2026-10-20_work_site-inspection</code></div>
      <div class="fld"><label>日期</label><input id="newDate" type="date"></div>
      <div class="fld"><label>分类</label>
        <div class="chips" id="newSlug" style="margin-bottom:0"></div>
      </div>
      <div class="fld"><label>主题（≤20字）</label><input id="newTopic" placeholder="例如 site-inspection"></div>
    </div>
    <div class="ft">
      <button class="btn" onclick="closeM('mNew')">取消</button>
      <button class="btn pr" id="newOk">创建</button>
    </div>
  </div>
</div>

<!-- 全屏预览 / 播放（点缩略图上的角标或双击卡片） -->
<div id="pv">
  <div class="pvh"><span class="f1" id="pvName"></span><button class="x" onclick="closePv()" title="关闭 (Esc)">×</button></div>
  <div id="pvBody"></div>
  <button class="pvn" id="pvPrev" title="上一个 (←)">‹</button>
  <button class="pvn" id="pvNext" title="下一个 (→)">›</button>
  <div class="pvf" id="pvMeta"></div>
</div>

<div id="toast"></div>

<script>
const CGI='/cgi/archive.cgi';
let EVENTS=[];          // {folder,ym,count,size,meta}
let FILES={};           // folder -> [{name,size,ext}]
let OPEN={};            // folder -> bool
let PICK=new Set();     // {folder} + '|' + name  组成的键
let SELMODE=false;      // 是否处于选择模式
let GRPOPEN={};         // slug -> bool（类型分组展开状态，默认展开）
let YRCLOSED={};        // 'slug|year' -> true（年份收起状态）
let CURFILES={};        // folder -> 上一次 loadFiles 的完整数组（预览翻页要用）
/* 事件内分批的依据：'arc' = 按存入时间（默认），'shot' = 按拍摄时间。
   两种视角各有用途：存入时间看「这批是什么时候进来的」，
   拍摄时间看「这件事是哪几天发生的」——一次补传的老照片会按真实日期散开。 */
let BATCHBY='arc';

/* 浏览器能直接播的容器。mkv/webm 在 Chrome 里看编码，放进来会直接报错，
   所以只有这几种走 <video>，其余仍按普通文件处理。 */
const VIDEXT=['mp4','m4v','mov','3gp'];

/* 分类显示名，与判定页保持一致 */
const CATNAME={work:'工地施工',home:'家庭生活',screenshot:'手机截图',video:'视频',other:'其他',unclassified:'未识别'};
/* 无封面时的分类图标 */
const CATICON={work:'🏗',home:'🏠',screenshot:'📱',video:'🎬',other:'📁',unclassified:'❓'};

/* 分类 slug：优先取 events.jsonl 的 meta.slug，缺失时从 日期_分类_主题 第 2 段解析 */
function slugOf(e){
  const s=e.meta&&e.meta.slug;
  if(s) return s;
  const p=String(e.folder||'').split('_');
  return (p.length>=2&&p[1])||'other';
}
/* 事件主题：优先 meta.topic，回退文件夹名第 3 段 */
function topicOf(e){
  const t=e.meta&&e.meta.topic;
  if(t) return t;
  const p=String(e.folder||'').split('_');
  return p.length>=3?p.slice(2).join('_'):String(e.folder||'');
}
/* 事件日期：优先 meta.start_date，回退文件夹名前 10 位 */
function dateOf(e){
  const d=e.meta&&e.meta.start_date;
  if(d) return d;
  const m=String(e.folder||'').match(/^(\d{4}-\d{2}-\d{2})/);
  return m?m[1]:'';
}
/* 事件卡封面：同样不能拉原图（一个封面 4.7 MB，列表一屏就十几 MB）。
   统一走 thumb.cgi，它会先查 /thumb/ 有没有现成的，没有才现做一张。 */
function coverSrc(e){
  if(!e.cover) return '';
  return '/cgi/thumb.cgi?mid='+encodeURIComponent(e.cover);
}

/* 单个事件夹卡片 */
function evCard(e){
  const op=OPEN[e.folder]?' open':'';
  return `<div class="ev${op}" data-f="${esc(e.folder)}">
    <div class="evh">
      <span class="arw">▶</span>

}

function toast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('err',!!isErr); t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'), isErr?4200:2200);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(n){
  n=Number(n||0);
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  if(n<1073741824) return (n/1048576).toFixed(1)+' MB';
  return (n/1073741824).toFixed(2)+' GB';
}

/* 最近变动时间：秒级时间戳 → "今天 / 昨天 / MM-DD / YYYY-MM-DD"
 * 口径是事件夹内文件 mtime 的最大值，即这个事件最后一次进/出文件的时间。
 * 不用目录 mtime：实测各事件夹的目录 mtime 全被同一次批量操作抹平，没有区分度。
 * 除今天/昨天外一律显示日期——混用"N 天前"会让多个事件夹无法横向比新旧。 */
function fmtLast(sec){
  const t=Number(sec||0);
  if(!t) return '';
  const now=new Date(), d=new Date(t*1000);
  const d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const d1=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const days=Math.round((d0-d1)/86400000);
  if(days<=0) return '今天';
  if(days===1) return '昨天';
  const md=pad2d(d.getMonth()+1)+'-'+pad2d(d.getDate());
  return d.getFullYear()===now.getFullYear()?md:(d.getFullYear()+'-'+md);
}
function pad2d(n){ return String(n).padStart(2,'0'); }
/* 秒级时间戳 → YYYY-MM-DD（本地时区） */
function fmtDay(sec){
  const t=Number(sec||0); if(!t) return '';
  const d=new Date(t*1000);
  return d.getFullYear()+'-'+pad2d(d.getMonth()+1)+'-'+pad2d(d.getDate());
}
/* 秒级时间戳 → YYYY-MM-DD HH:MM */
function fullDay(sec){
  const t=Number(sec||0); if(!t) return '';
  const d=new Date(t*1000);
  return fmtDay(t)+' '+pad2d(d.getHours())+':'+pad2d(d.getMinutes());
}
/* 精确到分钟的完整时间，用于 title 悬浮提示 */
function fullLast(sec){
  const t=Number(sec||0);
  if(!t) return '';
  const d=new Date(t*1000);
  return d.getFullYear()+'-'+pad2d(d.getMonth()+1)+'-'+pad2d(d.getDate())+' '+
         pad2d(d.getHours())+':'+pad2d(d.getMinutes());
}
/* 卡片上的时间标签：优先说「存入」（回执里的归档时刻），没有回执才退回「拍摄」。
 * 两者语义完全不同，所以文案必须区分开，不能都写「更新」，
 * 否则用户会以为文件是那天拍/那天进的，其实可能差好几个月。 */
function lastTag(e){
  const s=fmtLast(e.last);
  if(!s) return '';
  const days=e.last?(Date.now()/1000-Number(e.last))/86400:0;
  const cls=days>30?'lz old':'lz';
  const isShot=e.lastSrc==='file';
  const label=isShot?'拍摄':'存入';
  const tip=isShot?'最新一张的拍摄时间':'最近一次存入时间';
  return `<span class="${cls}" title="${tip} ${esc(fullLast(e.last))}">${label} ${esc(s)}</span>`;
}
function closeM(id){ document.getElementById(id).classList.remove('on'); }

// ---------- 数据加载 ----------
async function loadAll(){
  try{
    const r=await fetch(CGI+'?action=list',{cache:'no-store'});
    const j=await r.json();
    if(!j.ok) throw new Error(j.err||'load failed');
    EVENTS=j.events||[];
    renderList(j.trash);
  }catch(e){
    document.getElementById('list').innerHTML='<div class="empty" style="color:#dc2626">加载失败：'+esc(e.message)+'</div>';
  }
}

async function loadFiles(folder){
  if(FILES[folder]) return FILES[folder];
  const url=CGI+'?action=files&folder='+encodeURIComponent(folder);
  const r=await fetch(url,{cache:'no-store'});
  const j=await r.json();
  if(!j.ok) throw new Error(j.err||'files failed');
  FILES[folder]=j.files||[];
  return FILES[folder];
}

// ---------- 渲染事件列表 ----------
function renderList(trash){
  const total=EVENTS.reduce((a,e)=>a+(e.count||0),0);
  const totalSz=EVENTS.reduce((a,e)=>a+(e.size||0),0);
  let st=EVENTS.length+' 个事件夹 · '+total+' 个文件 · '+fmtSize(totalSz);
  if(trash&&trash.count) st+=' · 回收区 '+trash.count+' 个 ('+fmtSize(trash.size)+')';
  document.getElementById('hstat').textContent=st;

  const el=document.getElementById('list');
  if(!EVENTS.length){ el.innerHTML='<div class="empty">还没有已存档的文件</div>'; return; }

  // 按年月倒序
  const sorted=[...EVENTS].sort((a,b)=>{
    if(a.ym!==b.ym) return b.ym.localeCompare(a.ym);
    return (b.meta&&b.meta.start_date||'').localeCompare(a.meta&&a.meta.start_date||'');
  });

  // 二级分组：类型（slug）→ 年份。slugOf() 已提到全局，与选择器共用一套口径。
  const groups={};   // slug -> {year -> [events]}
  sorted.forEach(e=>{
    const sl=slugOf(e);
    const yr=String(e.meta&&e.meta.start_date||e.folder||'').slice(0,4)||'未知';
    groups[sl]=groups[sl]||{};
    (groups[sl][yr]=groups[sl][yr]||[]).push(e);
  });

  // 类型顺序：按各自文件总数降序，让有内容的最先出现
  const slTotal=sl=>Object.values(groups[sl]).reduce((a,arr)=>a+arr.reduce((x,e)=>x+(e.count||0),0),0);
  const sls=Object.keys(groups).sort((a,b)=>slTotal(b)-slTotal(a));

  el.innerHTML=sls.map(sl=>{
    const yrs=Object.keys(groups[sl]).sort((a,b)=>b.localeCompare(a));
    const gN=yrs.reduce((a,y)=>a+groups[sl][y].reduce((x,e)=>x+(e.count||0),0),0);
    const gS=yrs.reduce((a,y)=>a+groups[sl][y].reduce((x,e)=>x+(e.size||0),0),0);
    const gid='g-'+sl;
    const gopen=GRPOPEN[sl]!==false;   // 默认展开
    const inner=yrs.map(yr=>{
      const evs=groups[sl][yr];
      const yN=evs.reduce((a,e)=>a+(e.count||0),0);
      const yS=evs.reduce((a,e)=>a+(e.size||0),0);
      const yk=sl+'|'+yr;
      const closed=YRCLOSED[yk]?' closed':'';
      return `<div class="evwrap${closed}" data-yr="${esc(yr)}" data-yk="${esc(yk)}">
        <div class="yrbar${closed}" title="点一下收起或展开这一年的全部事件">
          <span class="arw">▶</span><span>${esc(yr)} 年</span>
          <span class="n">${evs.length} 个事件 · ${yN} 个文件 · ${fmtSize(yS)}</span>
          <span class="cl">${closed?'已收起':'收起'}</span>
        </div>
        <div class="evlist">${evs.map(e=>evCard(e)).join('')}</div>
      </div>`;
    }).join('');
    return `<div class="grp${gopen?' open':''}" data-g="${esc(sl)}">
      <div class="grph">
        <span class="arw">▶</span>
        <span class="tp">${esc(CATNAME[sl]||sl)}</span>
        <span class="yr">${yrs.length} 年</span>
        <span class="sm">${groups[sl] ? yrs.reduce((a,y)=>a+groups[sl][y].length,0) : 0} 个事件 · ${gN} 个文件 · ${fmtSize(gS)}</span>
      </div>
      <div class="grgb" id="${esc(gid)}">${inner}</div>
    </div>`;
  }).join('');

  // 分组头折叠
  el.querySelectorAll('.grph').forEach(h=>{
    h.addEventListener('click',()=>{
      const g=h.parentNode;
      g.classList.toggle('open');
      GRPOPEN[g.dataset.g]=g.classList.contains('open');
    });
  });

  // 年份条折叠：点一下把整年的事件收起来，只留汇总行。
  // 事件夹本身可能很多，逐个月份滚很累；按年收起后能横向比各年体量。
  el.querySelectorAll('.yrbar').forEach(bar=>{
    bar.addEventListener('click',()=>{
      const wrap=bar.parentNode;
      const k=wrap.dataset.yk;
      const nowClosed=!wrap.classList.contains('closed');
      wrap.classList.toggle('closed',nowClosed);
      bar.classList.toggle('closed',nowClosed);
      YRCLOSED[k]=nowClosed;
      const cl=bar.querySelector('.cl');
      if(cl) cl.textContent=nowClosed?'已收起':'收起';
    });
  });

  // 绑定事件
  el.querySelectorAll('.ev').forEach(ev=>{
    const folder=ev.dataset.f;
    ev.querySelector('.evh').addEventListener('click',ev2=>{
      if(ev2.target.closest('button')) return;
      toggleEv(ev,folder);
    });
    ev.querySelector('[data-a="sel"]').addEventListener('click',()=>{
      toggleSelMode(ev,folder);
    });
    ev.querySelector('[data-a="ren"]').addEventListener('click',()=>openRenEvent(folder));
  });

  // 恢复已展开的
  sorted.forEach(e=>{
    if(OPEN[e.folder]){
      const ev=el.querySelector('.ev[data-f="'+cssEsc(e.folder)+'"]');
      if(ev) fillFiles(ev,e.folder);
    }
  });
  updBulk();
}
function cssEsc(s){ return String(s).replace(/["\\]/g,'\\$&'); }

function toggleEv(ev,folder){
  OPEN[folder]=!OPEN[folder];
  ev.classList.toggle('open',OPEN[folder]);
  if(OPEN[folder]) fillFiles(ev,folder);
}

/* 给网格里的卡片绑事件。抽出来是因为切换分组方式时要原地重渲染，
   不能走 fillFiles（那会重新请求接口，还会冲掉滚动位置）。 */
function bindItems(body,folder){
  body.querySelectorAll('.it').forEach(it=>{
    const name=it.dataset.k.split('|').slice(1).join('|');
    // 勾选框：始终可点，专门用来多选
    const ck=it.querySelector('.ck');
    if(ck) ck.addEventListener('click',e2=>{ e2.stopPropagation(); togglePick(it); });
    // 卡片主体：选择模式下=勾选；平时=全屏预览/播放（和 alist 一致）
    it.addEventListener('click',()=>{
      if(SELMODE) togglePick(it);
      else openPv(folder,name);
    });
  });
}

async function fillFiles(ev,folder){
  const body=ev.querySelector('.evb');
  try{
    const files=await loadFiles(folder);
    CURFILES[folder]=files;
    if(!files.length){ body.innerHTML='<div class="empty" style="padding:16px 0">此事件夹为空</div>'; return; }
    body.innerHTML=renderFiles(folder,files);
    bindItems(body,folder);
  }catch(e){
    body.innerHTML='<div class="empty" style="color:#dc2626">加载失败：'+esc(e.message)+'</div>';
  }
}

/* 按日期分批显示，依据由 BATCHBY 决定：
     · 存入时间（默认）—— 同一事件夹的文件往往不是一次存进来的，先存 30 张、
       隔几天补 10 张；回执里每条 arc 记录都带 ts，据此分组才看得出批次，
       没有回执的老文件统一归到「更早归档」。
     · 拍摄时间 —— 文件名里的日期（IMG_/VID_/微信 mmexport）。一次补传一堆
       老照片时，按拍摄日期会散成多天，更贴近「这件事是哪几天发生的」。
       解析不出日期的归到最后一组，不假装有日期。 */
function batchKey(f){
  if(BATCHBY==='shot') return f.shot||'';
  return f.arcTs?fmtDay(f.arcTs):'';
}
function renderFiles(folder,files){
  const shot=(BATCHBY==='shot');
  const groups=[], idx={};
  files.forEach(f=>{
    const k=batchKey(f);
    if(!(k in idx)){ idx[k]=groups.length; groups.push({k:k,items:[]}); }
    groups[idx[k]].items.push(f);
  });
  groups.sort((a,b)=>{
    if(!a.k) return 1;
    if(!b.k) return -1;
    return b.k.localeCompare(a.k);   // 新批次在上
  });
  return groups.map(g=>{
    const sz=g.items.reduce((a,f)=>a+(f.size||0),0);
    const label=g.k?(g.k+(shot?' 拍摄':' 存入')):(shot?'拍摄时间未知':'更早归档');
    const tag=g.k?'':(shot?'<span class="tag">文件名里没有日期</span>'
                          :'<span class="tag">无存档回执</span>');
    return `<div class="bat">
      <div class="bath"><span class="bts">${esc(label)}</span>
        <span class="n">${g.items.length} 个 · ${fmtSize(sz)}</span>${tag}</div>
      <div class="grid">${g.items.map(f=>fileCard(folder,f)).join('')}</div>
    </div>`;
  }).join('');
}

/* 缩略图地址（图片和视频共用一套）：
   已生成过静态图就直连 /thumb/<mid>.jpg，没有就让 thumb.cgi 现做一张。
   绝对不能让网格直接拉 /media/<mid>.jpg —— 那是原图，平均 4.7 MB，
   一个 34 张的事件就是 158 MB，手机上要几十秒（2026-11-07 实测）。 */
function thumbSrc(f){
  return f.thumb?('/thumb/'+encodeURIComponent(f.mid)+'.jpg')
                :('/cgi/thumb.cgi?mid='+encodeURIComponent(f.mid));
}
/* 原图地址：只在全屏预览时用 */
function fullSrc(f){
  return '/media/'+encodeURIComponent(f.mid)+'.'+encodeURIComponent(f.ext);
}

function fileCard(folder,f){
  const key=folder+'|'+f.name;
  const pk=PICK.has(key)?' picked':'';
  const isVid=VIDEXT.includes(f.ext);
  const th=thumbSrc(f);
  let inner=`<img loading="lazy" src="${th}" alt="" onerror="this.style.display='none';var v=this.parentNode.querySelector('.vf');if(v)v.style.display='flex';">
      <div class="vf" style="display:none">${isVid?'▶':'⚠'}<small>${isVid?esc(f.ext.toUpperCase())+' ':''}${fmtSize(f.size)}</small></div>`;
  if(isVid) inner+='<div class="pl">▶</div>';
  const dt=f.shot?`<div class="dt">${esc(f.shot.slice(5))}</div>`:'';
  return `<div class="it${pk}${SELMODE?' selmode':''}" data-k="${esc(key)}" title="${esc(fileTip(f))}">
    ${inner}${dt}<div class="ck">✓</div><div class="nm">${esc(f.name)}</div>
  </div>`;
}

/* 悬浮提示：把拍摄时间、存入时间、体积一次说清 */
function fileTip(f){
  const p=[f.name];
  if(f.shot) p.push('拍摄 '+f.shot);
  if(f.arcTs) p.push('存入 '+fullDay(f.arcTs));
  p.push(fmtSize(f.size));
  return p.join(' · ');
}

function togglePick(it){
  const k=it.dataset.k;
  if(PICK.has(k)){ PICK.delete(k); it.classList.remove('picked'); }
  else{ PICK.add(k); it.classList.add('picked'); }
  updBulk();
}

// ---------- 全屏预览 / 播放 ----------
// 和大厂相册一样的习惯：点开就是全屏，左右键翻同一事件内的文件，Esc 退出，图片再点一下放大。
// 翻页范围限定在「当前事件夹的完整文件列表」，跨批次也能连续翻。
let PVLIST=[];   // [{folder,f}]
let PVIDX=0;
let PVZOOM=1;

function openPv(folder,name){
  const files=(CURFILES[folder]||[]);
  const i=files.findIndex(f=>f.name===name);
  if(i<0) return;
  PVLIST=files.map(f=>({folder:folder,f:f}));
  document.getElementById('pv').classList.add('on');
  showPv(i);
}

function showPv(i){
  if(!PVLIST.length) return;
  PVIDX=(i+PVLIST.length)%PVLIST.length;
  const f=PVLIST[PVIDX].f;
  const full=fullSrc(f);
  const isVid=VIDEXT.includes(f.ext);
  const body=document.getElementById('pvBody');
  document.getElementById('pvName').textContent=f.name;
  if(isVid){
    // 视频用原生 <video>：mp4/mov 都是 H.264，Chrome/Edge/Safari 直接能解。
    // poster 用缩略图，避免解码首帧前一片黑。
    body.innerHTML='<video src="'+esc(full)+'" controls autoplay playsinline preload="metadata" poster="'+esc(thumbSrc(f))+'"></video>';
  }else{
    // 先铺缩略图（瞬间出画），原图在后台加载，好了再无缝换上去。
    // 直接等原图要一两秒，加载期间全屏是空的，体验很差。
    body.innerHTML='<img src="'+esc(thumbSrc(f))+'" alt="" data-full="'+esc(full)+'" title="再点一下放大/还原">';
    const im=body.querySelector('img');
    const pre=new Image();
    pre.onload=function(){
      if(im.dataset.full===full){ im.src=full; }   // 期间翻页了就丢弃这次结果
    };
    pre.src=full;
  }
  PVZOOM=1;
  const meta=[(PVIDX+1)+' / '+PVLIST.length, fmtSize(f.size)];
  if(f.shot) meta.push('拍摄 '+f.shot);
  if(f.arcTs) meta.push('存入 '+fullDay(f.arcTs));
  document.getElementById('pvMeta').textContent=meta.join(' · ');
}

function closePv(){
  document.getElementById('pv').classList.remove('on');
  document.getElementById('pvBody').innerHTML='';   // 清空才能停掉视频声音
}

function pvStep(d){
  if(PVLIST.length<2) return;
  showPv(PVIDX+d);
}

function pvBind(){
  const pv=document.getElementById('pv');
  // 点黑色背景关闭（点图片/视频不关）
  pv.addEventListener('click',e=>{ if(e.target===pv) closePv(); });
  document.getElementById('pvPrev').addEventListener('click',e=>{ e.stopPropagation(); pvStep(-1); });
  document.getElementById('pvNext').addEventListener('click',e=>{ e.stopPropagation(); pvStep(1); });
  // 图片点一下在「适应窗口 / 2 倍」之间切换
  document.getElementById('pvBody').addEventListener('click',e=>{
    if(e.target.tagName!=='IMG') return;
    PVZOOM=PVZOOM>1?1:2;
    e.target.style.transform=PVZOOM>1?'scale(2)':'none';
    e.target.style.cursor=PVZOOM>1?'zoom-out':'zoom-in';
  });
  window.addEventListener('keydown',e=>{
    if(!pv.classList.contains('on')) return;
    if(e.key==='Escape'){ closePv(); }
    else if(e.key==='ArrowLeft'){ pvStep(-1); }
    else if(e.key==='ArrowRight'){ pvStep(1); }
  });
}
pvBind();

function toggleSelMode(ev,folder){
  SELMODE=true;
  ev.classList.add('open'); OPEN[folder]=true;
  fillFiles(ev,folder).then(()=>{
    ev.querySelectorAll('.it').forEach(it=>it.classList.add('selmode'));
  });
  toast('点击缩略图多选，选好后用底部操作条');
}

function updBulk(){
  const n=PICK.size;
  const bar=document.getElementById('bulkbar');
  bar.classList.toggle('on',n>0);
  document.getElementById('pkn').textContent=n;
}

// ---------- 事件夹重命名 ----------
let renTarget=null; // {type:'event',folder} 或 {type:'file',folder,name}
function openRenEvent(folder){
  renTarget={type:'event',folder};
  document.getElementById('renTip').innerHTML='夹名格式为 <b>日期_分类_主题</b>。改名会同步更新事件表，不影响文件内容。';
  document.getElementById('renLbl').textContent='新事件夹名';
  document.getElementById('renInput').value=folder;
  document.getElementById('mRen').classList.add('on');
  setTimeout(()=>document.getElementById('renInput').focus(),100);
}
function openRenFile(folder,name){
  renTarget={type:'file',folder,name};
  const ext=(name.match(/\.[^.]+$/)||[''])[0];
  document.getElementById('renTip').innerHTML='只改文件名，扩展名请保留 <b>'+esc(ext)+'</b>';
  document.getElementById('renLbl').textContent='新文件名';
  document.getElementById('renInput').value=name;
  document.getElementById('mRen').classList.add('on');
  setTimeout(()=>document.getElementById('renInput').focus(),100);
}

document.getElementById('renOk').addEventListener('click',async()=>{
  const nn=document.getElementById('renInput').value.trim();
  if(!nn){ toast('名称不能为空',true); return; }
  if(!renTarget) return;
  try{
    let url;
    if(renTarget.type==='event'){
      url=CGI+'?action=rename&folder='+encodeURIComponent(renTarget.folder)+'&newname='+encodeURIComponent(nn);
    }else{
      url=CGI+'?action=renamefile&folder='+encodeURIComponent(renTarget.folder)+'&file='+encodeURIComponent(renTarget.name)+'&newname='+encodeURIComponent(nn);
    }
    const r=await fetch(url,{cache:'no-store'});
    const j=await r.json();
    if(!j.ok) throw new Error(j.err||'rename failed');
    toast('已重命名');
    closeM('mRen');
    if(renTarget.type==='event'){
      delete FILES[renTarget.folder];
      const old=renTarget.folder;
      // 更新本地缓存
      const idx=EVENTS.findIndex(e=>e.folder===old);
      if(idx>=0){ EVENTS[idx].folder=j.folder; FILES[j.folder]=FILES[old]; delete FILES[old]; }
    }else{
      delete FILES[renTarget.folder];
    }
    renTarget=null;
    await loadAll();
  }catch(e){ toast('失败：'+e.message,true); }
});

// ---------- 移动到其他事件（图形化选择器） ----------
let MVSRC=null;        // 来源事件夹
let MVPICK=null;       // 已选中的目标事件夹
let MVQ='';            // 搜索词
let MVCAT='all';       // 分类筛选

document.getElementById('bkmove').addEventListener('click',openMove);

function openMove(){
  if(!PICK.size){ toast('请先选择文件',true); return; }
  const folders=[...new Set([...PICK].map(k=>k.split('|')[0]))];
  if(folders.length>1){ toast('一次只能移动同一事件夹里的文件，请分开操作',true); return; }
  MVSRC=folders[0]; MVPICK=null; MVQ=''; MVCAT='all';
  document.getElementById('mvQ').value='';
  document.getElementById('mvTip').innerHTML=
    '要把 <b>'+PICK.size+'</b> 个文件从 <code>'+esc(MVSRC)+'</code> 移到哪个事件夹？点卡片选中即可。';
  document.getElementById('mMove').classList.add('on');
  renderPicker();
}

document.getElementById('mvQ').addEventListener('input',e=>{
  MVQ=e.target.value||'';
  renderPicker();
});

/* 拼音首字母索引：按事件缓存在对象上，loadAll 换一批数据后自然失效。
 * 只在搜索词含字母时才算，纯中文/日期搜索不触发。
 * PY 来自 /pinyin.js，若未加载则返回空串，搜索自动退回原文匹配。 */
function pyIndexOf(e){
  if(e._py!==undefined) return e._py;
  let s='';
  try{
    if(window.PY&&PY.initials) s=PY.initials([e.folder,topicOf(e),dateOf(e),(CATNAME[slugOf(e)]||'')].join(' '));
  }catch(err){ s=''; }
  e._py=s;
  return s;
}

/* 事件卡片（选择器内） */
function pkCard(e){
  const sl=slugOf(e);
  const cov=e.cover
    ? `<img loading="lazy" src="${esc(coverSrc(e))}" onerror="this.style.display='none';var p=this.parentNode.querySelector('.ph');if(p)p.style.display='flex';">`
    : '';
  const phStyle=e.cover?'display:none':'';
  const d=dateOf(e);
  return `<div class="pk${MVPICK===e.folder?' on':''}" data-f="${esc(e.folder)}" title="${esc(e.folder)}">
    <div class="cv">${cov}<div class="ph" style="${phStyle}">${CATICON[sl]||'📁'}</div></div>
    <div class="tx">
      <div class="tp2">${esc(topicOf(e))}</div>
      <div class="mt"><span>${esc(d||e.ym)}</span><span>·</span><span>${e.count} 个 · ${fmtSize(e.size)}</span></div>
      <div class="mt"><span class="tg">${esc(CATNAME[sl]||sl)}</span>${lastTag(e)}</div>
    </div>
  </div>`;
}

function renderPicker(){
  const others=EVENTS.filter(e=>e.folder!==MVSRC);

  /* 搜索：支持用空格分词，多词之间是「与」关系。
   * 每个词先按原文匹配（主题/夹名/日期/分类名），未命中再试拼音首字母串——
   * 打 hhgc 能命中「project-meeting」，打 hh 例会 也能命中。 */
  const q=MVQ.trim().toLowerCase();
  const terms=q?q.split(/\s+/).filter(Boolean):[];
  const hasAscii=/[a-z]/.test(q);
  const matched=others.filter(e=>{
    if(!terms.length) return true;
    const hay=(e.folder+' '+topicOf(e)+' '+dateOf(e)+' '+(CATNAME[slugOf(e)]||'')).toLowerCase();
    const py=hasAscii?pyIndexOf(e):'';
    return terms.every(t=> hay.indexOf(t)>=0 || (py && py.indexOf(t)>=0));
  });

  // 分类计数基于搜索结果，保证筛选片数字与屏幕上看到的卡片数一致
  const cnt={};
  matched.forEach(e=>{ const s=slugOf(e); cnt[s]=(cnt[s]||0)+1; });
  const cats=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  // 当前选中的分类在新结果里已无命中时，自动回落到「全部」，避免出现空网格
  if(MVCAT!=='all' && !cnt[MVCAT]) MVCAT='all';

  document.getElementById('mvCats').innerHTML=
    [{k:'all',n:'全部',c:matched.length},...cats.map(c=>({k:c,n:CATNAME[c]||c,c:cnt[c]}))]
      .map(x=>`<button class="chip${MVCAT===x.k?' on':''}" data-c="${esc(x.k)}">${esc(x.n)} ${x.c}</button>`)
      .join('');
  document.getElementById('mvCats').querySelectorAll('.chip').forEach(b=>{
    b.onclick=()=>{ MVCAT=b.dataset.c; renderPicker(); };
  });

  const list=matched.filter(e=>MVCAT==='all' || slugOf(e)===MVCAT);

  const grid=document.getElementById('mvGrid');
  if(!others.length){
    grid.innerHTML='<div class="pknone">没有其他事件夹。点右上角「＋ 新建」先建一个。</div>';
  }else if(!list.length){
    grid.innerHTML='<div class="pknone">没有匹配的事件夹。可试主题关键字、日期（2026-10）或拼音首字母（hhgclh）。</div>';
  }else{
    grid.innerHTML=list.map(pkCard).join('');
    grid.querySelectorAll('.pk').forEach(el=>{
      el.addEventListener('click',()=>{
        MVPICK=el.dataset.f;
        grid.querySelectorAll('.pk').forEach(x=>x.classList.toggle('on',x===el));
        updPickerFoot();
      });
    });
  }
  updPickerFoot();
}

function updPickerFoot(){
  const el=document.getElementById('mvPicked');
  const btn=document.getElementById('mvOk');
  if(MVPICK){
    el.innerHTML='目标：<b>'+esc(topicOf(EVENTS.find(e=>e.folder===MVPICK)||{folder:MVPICK}))+'</b>';
    btn.disabled=false;
  }else{
    el.textContent='未选择目标事件';
    btn.disabled=true;
  }
}

document.getElementById('mvOk').addEventListener('click',async()=>{
  if(!MVPICK){ toast('请先选目标事件',true); return; }
  const to=MVPICK;
  const src=MVSRC;
  const names=[...PICK].map(k=>k.split('|')[1]);
  const btn=document.getElementById('mvOk');
  btn.disabled=true;
  try{
    const url=CGI+'?action=move&from='+encodeURIComponent(src)+'&to='+encodeURIComponent(to)+'&files='+encodeURIComponent(names.join(','));
    const r=await fetch(url,{cache:'no-store'});
    const j=await r.json();
    if(!j.ok) throw new Error(j.err||'move failed');
    toast('已移动 '+j.moved+' 个，跳过 '+j.skip+' 个'+(j.err?('，失败 '+j.err):''));
    closeM('mMove');
    PICK.clear(); SELMODE=false;
    delete FILES[src]; delete FILES[to];
    MVPICK=null; MVSRC=null;
    await loadAll();
  }catch(e){
    toast('失败：'+e.message,true);
    btn.disabled=false;
  }
});

// ---------- 批量重命名（加前缀/序号） ----------
document.getElementById('bkren').addEventListener('click',()=>{
  if(!PICK.size){ toast('请先选择文件',true); return; }
  const folders=[...new Set([...PICK].map(k=>k.split('|')[0]))];
  if(folders.length>1){ toast('一次只能处理同一事件夹',true); return; }
  const spec=prompt('批量重命名格式：\n用 {n} 表示序号（从1开始），{orig} 表示原文件名（不含扩展名）\n例如：现场_{n}  →  现场_1.jpg / 现场_2.jpg', '现场_{n}');
  if(spec===null) return;
  if(!spec.trim()){ toast('格式不能为空',true); return; }
  doBatchRename(folders[0],spec.trim());
});

async function doBatchRename(folder,spec){
  const names=[...PICK].map(k=>k.split('|')[1]).sort();
  const others=EVENTS.filter(e=>e.folder!==folder).map(e=>e.folder);
  let ok=0,fail=0;
  for(let i=0;i<names.length;i++){
    const old=names[i];
    const ext=(old.match(/\.[^.]+$/)||[''])[0];
    const orig=old.slice(0,old.length-ext.length);
    let nn=spec.replace(/\{n\}/g,String(i+1)).replace(/\{orig\}/g,orig).replace(/[\/\\:*?"<>|]/g,'');
    if(!nn){ fail++; continue; }
    if(!new RegExp(ext.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$','i').test(nn)) nn+=ext;
    try{
      const url=CGI+'?action=renamefile&folder='+encodeURIComponent(folder)+'&file='+encodeURIComponent(old)+'&newname='+encodeURIComponent(nn);
      const r=await fetch(url,{cache:'no-store'});
      const j=await r.json();
      if(j.ok) ok++; else fail++;
    }catch(e){ fail++; }
  }
  toast('批量重命名完成：成功 '+ok+'，失败 '+fail, fail>0);
  PICK.clear(); SELMODE=false;
  delete FILES[folder];
  await loadAll();
}

// ---------- 删除到回收区 ----------
document.getElementById('bkdel').addEventListener('click',async()=>{
  if(!PICK.size){ toast('请先选择文件',true); return; }
  const folders=[...new Set([...PICK].map(k=>k.split('|')[0]))];
  if(folders.length>1){ toast('一次只能处理同一事件夹',true); return; }
  const folder=folders[0];
  const names=[...PICK].map(k=>k.split('|')[1]);
  if(!confirm('把这 '+names.length+' 个文件移入回收区？\n（不会真正删除，可在 K40 的 nasbak/_待删/ 找回）')) return;
  try{
    const url=CGI+'?action=delete&folder='+encodeURIComponent(folder)+'&files='+encodeURIComponent(names.join(','));
    const r=await fetch(url,{cache:'no-store'});
    const j=await r.json();
    if(!j.ok) throw new Error(j.err||'delete failed');
    toast('已移入回收区，事件夹剩余 '+j.left+' 个');
    PICK.clear(); SELMODE=false;
    delete FILES[folder];
    await loadAll();
  }catch(e){ toast('失败：'+e.message,true); }
});

document.getElementById('bkclear').addEventListener('click',()=>{
  PICK.clear(); SELMODE=false;
  document.querySelectorAll('.it.picked').forEach(it=>it.classList.remove('picked'));
  updBulk();
});

// ---------- 新建事件 ----------
let NEWSLUG='other';
let NEW_THEN_MOVE=false;   // 由选择器里的「＋ 新建」触发时，建完回到选择器并选中

function renderSlugChips(){
  const opts=[['work','工作'],['home','家庭'],['screenshot','截图'],['video','视频'],['other','其他']];
  document.getElementById('newSlug').innerHTML=opts.map(([v,n])=>
    `<button class="chip${NEWSLUG===v?' on':''}" data-v="${v}" type="button">${n}</button>`).join('');
  document.getElementById('newSlug').querySelectorAll('.chip').forEach(b=>{
    b.onclick=()=>{ NEWSLUG=b.dataset.v; renderSlugChips(); };
  });
}

function openNewEvent(thenMove){
  NEW_THEN_MOVE=!!thenMove;
  NEWSLUG='other';
  renderSlugChips();
  const d=new Date();
  const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  document.getElementById('newDate').value=iso;
  document.getElementById('newTopic').value='';
  if(thenMove) closeM('mMove');
  document.getElementById('mNew').classList.add('on');
  setTimeout(()=>document.getElementById('newTopic').focus(),120);
}
document.getElementById('newOk').addEventListener('click',async()=>{
  const date=document.getElementById('newDate').value;
  const slug=NEWSLUG;
  const topic=document.getElementById('newTopic').value.trim();
  if(!date){ toast('请选日期',true); return; }
  if(!topic){ toast('请填主题',true); return; }
  try{
    const url=CGI+'?action=newevent&date='+encodeURIComponent(date)+'&slug='+encodeURIComponent(slug)+'&topic='+encodeURIComponent(topic);
    const r=await fetch(url,{cache:'no-store'});
    const j=await r.json();
    if(!j.ok) throw new Error(j.err||'create failed');
    toast('已创建：'+j.folder);
    closeM('mNew');
    const back=NEW_THEN_MOVE; NEW_THEN_MOVE=false;
    await loadAll();
    // 从选择器进来的，建完自动回到选择器并选中新事件，省一次点选
    if(back && MVSRC){
      MVPICK=j.folder; MVQ=''; MVCAT='all';
      document.getElementById('mvQ').value='';
      document.getElementById('mMove').classList.add('on');
      renderPicker();
    }
  }catch(e){ toast('失败：'+e.message,true); }
});

// 初始化放在两个切换器之后：它们要先从 localStorage 恢复状态，
// 否则首次渲染会按默认值画一遍再被覆盖。
/* 分批依据切换：存入时间 ↔ 拍摄时间。
   状态记 localStorage，刷新后保持；切换时只重渲染已经展开的事件夹
   （用 CURFILES 缓存，不重新请求接口），收起的事件等展开时自然按新规则分组。
   展开状态(OPEN)、勾选(PICK)、选择模式(SELMODE) 都不受影响。 */
(function(){
  const KEY='archive-batchby';
  const btn=document.getElementById('batchBtn');
  function apply(m){
    BATCHBY=(m==='shot')?'shot':'arc';
    const shot=BATCHBY==='shot';
    btn.textContent=shot?'按拍摄时间':'按存入时间';
    btn.title=shot?'当前按拍摄日期分批，点击改为按存入日期'
                  :'当前按存入日期分批，点击改为按拍摄日期';
  }
  apply(localStorage.getItem(KEY)||'arc');
  btn.onclick=()=>{
    apply(BATCHBY==='shot'?'arc':'shot');
    localStorage.setItem(KEY,BATCHBY);
    document.querySelectorAll('.ev.open').forEach(ev=>{
      const folder=ev.dataset.f;
      const files=CURFILES[folder];
      if(!files||!files.length) return;
      const body=ev.querySelector('.evb');
      body.innerHTML=renderFiles(folder,files);
      bindItems(body,folder);
    });
    updBulk();
  };
})();

/* 单列/双列切换：状态记在 localStorage，刷新后保持。
   纯 CSS 类切换，不碰渲染逻辑，展开状态(OPEN)和勾选(PICK)都不受影响 */
(function(){
  const KEY='archive-cols';
  const btn=document.getElementById('colBtn');
  function apply(cols){
    document.body.classList.toggle('cols2',cols===2);
    btn.textContent=cols===2?'单列':'双列';
    btn.title=cols===2?'切回单列显示':'切换双列显示';
  }
  const saved=+(localStorage.getItem(KEY)||1);
  apply(saved===2?2:1);
  btn.onclick=()=>{
    const next=document.body.classList.contains('cols2')?1:2;
    localStorage.setItem(KEY,next);
    apply(next);
  };
})();

// 两个切换器都恢复好状态了，再拉数据
loadAll();
</script>
