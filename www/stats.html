<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>统计 · 家庭文件储存管理</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--tx:#1a1d21;--mu:#6b7280;--bd:#dcdfe3;--pr:#2563eb;--dn:#dc2626;--ok:#16a34a;--wn:#d97706}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd);padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:15px}
.stat{font-size:12.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--bd);background:#fff;color:var(--tx);padding:5px 11px;border-radius:4px;font-size:13px;cursor:pointer}
.btn.pr{border-color:var(--pr);color:var(--pr)}
main{max-width:1000px;margin:0 auto;padding:16px}

/* 数字卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-bottom:16px}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:13px 15px}
.kc .lb{font-size:12px;color:var(--mu);margin-bottom:5px}
.kc .nm2{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kc .sub{font-size:11.5px;color:var(--mu);margin-top:3px;font-variant-numeric:tabular-nums}
.kc.b{border-left:3px solid var(--pr)}
.kc.g{border-left:3px solid var(--ok)}
.kc.w{border-left:3px solid var(--wn)}
.kc.r{border-left:3px solid var(--dn)}

h2{font-size:14px;margin:0 0 11px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:15px 17px;margin-bottom:15px}

/* 进度条 */
.pb{height:8px;background:#e9ecef;border-radius:4px;overflow:hidden;margin:8px 0 6px}
.pb i{display:block;height:100%;background:var(--pr);transition:width .3s}
.pbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}

/* 分类柱状 */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:flex;align-items:center;gap:10px;font-size:13px}
.bar .nm3{min-width:96px;color:var(--tx)}
.bar .tr{flex:1;height:20px;background:#f1f3f5;border-radius:4px;overflow:hidden;position:relative}
.bar .tr i{display:block;height:100%;background:var(--pr);border-radius:4px}
.bar .vl{min-width:62px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mu);font-size:12.5px}
.bar .pc{min-width:46px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--mu)}
.bar i.w{background:#2563eb}
.bar i.h{background:#16a34a}
.bar i.s{background:#7c3aed}
.bar i.v{background:#d97706}
.bar i.o{background:#64748b}
.bar i.u{background:#dc2626}

.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f2f4;font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--mu)}
.row .v{font-variant-numeric:tabular-nums}
.mini{font-size:12px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:26px 0}
</style>
</head>
<body>
<header>
  <b>统计</b>
  <span class="stat" id="hstat">加载中…</span>
  <span style="flex:1"></span>
  <button class="btn pr" id="refresh">刷新</button>
</header>

<main>
  <div class="cards" id="cards"></div>

  <h2>判定进度</h2>
  <div class="panel" id="judgebox"><div class="empty">加载中…</div></div>

  <h2>分类分布</h2>
  <div class="panel" id="catsbox"><div class="empty">加载中…</div></div>

  <h2>存储构成</h2>
  <div class="panel" id="storebox"><div class="empty">加载中…</div></div>

  <h2>操作台账</h2>
  <div class="panel" id="ledgerbox"><div class="empty">加载中…</div></div>
</main>

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtB(n){
  n=Number(n||0);
  if(!n) return '0 B';
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(1)+' KB';
  if(n<1073741824) return (n/1048576).toFixed(1)+' MB';
  return (n/1073741824).toFixed(2)+' GB';
}
const CATNAME={work:'工作',home:'家庭',screenshot:'截图',video:'视频',other:'其他',unclassified:'未分类'};
const CATCLS={work:'w',home:'h',screenshot:'s',video:'v',other:'o',unclassified:'u'};

async function load(){
  try{
    const r=await fetch('/cgi/status.cgi',{cache:'no-store'});
    const j=await r.json();
    if(!j.ok) throw new Error(j.err||'无数据');
    render(j);
  }catch(e){
    document.getElementById('cards').innerHTML='<div class="empty" style="color:#dc2626">加载失败：'+esc(e.message)+'</div>';
  }
}

function render(j){
  const f=j.files||{}, jd=j.judge||{}, d=j.disk||{}, lg=j.ledger||{};
  const done=Number(jd.done||0), pend=Number(jd.pending||0);
  const total=done+pend;
  const pct=total?Math.round(done*100/total):0;

  // 顶部卡片
  document.getElementById('cards').innerHTML=`
    <div class="kc b"><div class="lb">待判定文件</div><div class="nm2">${pend}</div><div class="sub">inbox 中等待处理</div></div>
    <div class="kc g"><div class="lb">已存档</div><div class="nm2">${f.archiveN||0}</div><div class="sub">${fmtB(f.archiveS)} · ${j.events||0} 个事件</div></div>
    <div class="kc w"><div class="lb">重复备份</div><div class="nm2">${f.dupN||0}</div><div class="sub">${fmtB(f.dupS)} · 待清理</div></div>
    <div class="kc r"><div class="lb">回收区</div><div class="nm2">${f.trashN||0}</div><div class="sub">已删除待清空</div></div>
    <div class="kc"><div class="lb">磁盘剩余</div><div class="nm2">${fmtB(d.avail)}</div><div class="sub">总 ${fmtB(d.total)} / 已用 ${fmtB(d.used)}</div></div>
  `;

  // 判定进度
  document.getElementById('judgebox').innerHTML=`
    <div class="pbl"><span>已判读 <b>${done}</b> 个</span><span>完成 <b>${pct}%</b></span></div>
    <div class="pb"><i style="width:${pct}%"></i></div>
    <div class="row"><span class="k">已判读</span><span class="v">${done} 个</span></div>
    <div class="row"><span class="k">待判读</span><span class="v" style="color:var(--wn)">${pend} 个</span></div>
    <div class="row"><span class="k">模型调用</span><span class="v">${(j.models&&j.models.zhipu)||0} 次成功</span></div>
    <div class="row"><span class="k">视频规则判</span><span class="v">${(j.models&&j.models.video)||0} 个（不调模型）</span></div>
    <div class="row"><span class="k">熔断占位</span><span class="v" style="color:var(--dn)">${(j.models&&j.models.circuit)||0} 个</span></div>
  `;

  // 分类分布
  const cats=j.cats||{};
  const maxN=Math.max(1,...Object.values(cats).map(v=>Number(v||0)));
  const rows=Object.keys(CATNAME).map(k=>{
    const n=Number(cats[k]||0);
    const w=Math.round(n*100/maxN);
    const pc=total?Math.round(n*100/total):0;
    return `<div class="bar">
      <span class="nm3">${CATNAME[k]}</span>
      <span class="tr"><i class="${CATCLS[k]}" style="width:${w}%"></i></span>
      <span class="vl">${n}</span>
      <span class="pc">${pc}%</span>
    </div>`;
  }).join('');
  document.getElementById('catsbox').innerHTML='<div class="bars">'+rows+'</div>';

  // 存储构成
  document.getElementById('storebox').innerHTML=`
    <div class="row"><span class="k">待判定 inbox</span><span class="v">${f.inboxN||0} 个 · ${fmtB(f.inboxS)}</span></div>
    <div class="row"><span class="k">已存档 archive</span><span class="v">${f.archiveN||0} 个 · ${fmtB(f.archiveS)}</span></div>
    <div class="row"><span class="k">重复备份 _dup_backup</span><span class="v">${f.dupN||0} 个 · ${fmtB(f.dupS)}</span></div>
    <div class="row"><span class="k">回收区 _待删</span><span class="v">${f.trashN||0} 个</span></div>
  `;

  // 台账
  document.getElementById('ledgerbox').innerHTML=`
    <div class="row"><span class="k">接收上传 recv</span><span class="v">${lg.recv||0} 条</span></div>
    <div class="row"><span class="k">日期归位 mvdate</span><span class="v">${lg.mvdate||0} 条</span></div>
    <div class="row"><span class="k">归档 arc</span><span class="v">${lg.arc||0} 条</span></div>
    <div class="row"><span class="k">去重 dup</span><span class="v">${lg.dup||0} 条</span></div>
    <div class="mini" style="margin-top:9px">台账文件：/data/media/0/nasbak/state/ledger.jsonl（已同步至云盘 state/）</div>
  `;

  const age=Number(j.ageSec||0);
  document.getElementById('hstat').textContent=age?(age<60?('数据 '+age+' 秒前'):('数据 '+Math.round(age/60)+' 分钟前')):'';
}

document.getElementById('refresh').onclick=load;
load();
setInterval(load,30000);
</script>
</body>
</html>
