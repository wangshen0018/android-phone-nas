# nasbak 全局配置 —— 改这里，不要改脚本。
#
# K40（现状）保持下面的默认值；装到 Linux / NAS 时改成注释里的那一组。
# 每个脚本通过 bin/lib-path.sh 读取本文件，环境变量 NASBAK_CONF 可覆盖位置。

# 库房根：inbox / archive / state 三个目录都在它下面
NASBAK_ROOT=/data/media/0/nasbak
# NAS 上改成：NASBAK_ROOT=/srv/nasbak

# 程序根：www / bin / logs
NASBAK_HOME=/data/adb/nasbak
# NAS 上改成：NASBAK_HOME=/opt/nasbak

NASBAK_PORT=8083
NASBAK_ALIST_PORT=5244

# 外部程序。留空则 lib-path.sh 自动在 PATH 里找。
NASBAK_FFMPEG=/data/adb/nasbak/bin/ffmpeg
# NAS 上改成：NASBAK_FFMPEG=/usr/bin/ffmpeg

NASBAK_BB=/data/adb/magisk/busybox
# NAS 上改成：NASBAK_BB=/usr/bin/busybox
