# aria2 config for K40 server
enable-rpc=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-allow-origin-all=true
rpc-secret=CHANGE_ME

dir=/data/media/0/Download/server
input-file=/data/adb/srv/aria2.session
save-session=/data/adb/srv/aria2.session
save-session-interval=30

daemon=true
log=/data/adb/srv/data/aria2.log
log-level=warn
console-log-level=warn

max-concurrent-downloads=5
max-connection-per-server=16
split=16
min-split-size=1M
max-overall-download-limit=0
continue=true
always-resume=true
file-allocation=none
auto-file-renaming=true
check-certificate=true

listen-port=6801
bt-max-peers=128
bt-external-ip=<K40_LAN_IP>
seed-time=0
peer-id-prefix=-TR2770-
user-agent=qBittorrent/4.2.5
async-dns=true
ca-certificate=/data/adb/srv/ca-bundle.crt
async-dns-server=<ROUTER_DNS>,223.5.5.5,119.29.29.29
# DNS fallback 2026-10-17: async-dns (musl c-ares) got empty answers for CN
# mirrors, so use the system resolver instead. Android has no /etc/resolv.conf,
# so RESOLV_CONF is pointed at our own copy by service.d/srv.sh.

dht-file-path=/data/adb/srv/data/dht.dat
dht-file-path6=/data/adb/srv/data/dht.dat6
