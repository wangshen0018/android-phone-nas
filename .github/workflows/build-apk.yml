name: build-apk

# 本机不装 Android SDK / JDK / gradle，全部构建在 GitHub 托管的 runner 上完成。
# 两个模块各出一个 APK：client（看照片）、server（当库房）。
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不装 android-actions/setup-android：它会去 sdkmanager 装名为 "tools" 的包，
      # 而新版 cmdline-tools 已删掉该包，直接 exit 1。runner 镜像本身预装了 SDK。
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure signing keystore
        run: |
          # 仓库里还没有就生成一个（首次运行），随后作为产物导出、回填仓库固定下来。
          if [ ! -f apps/keystore/nasbak.p12 ]; then
            mkdir -p apps/keystore
            keytool -genkeypair -v \
              -keystore apps/keystore/nasbak.p12 -storetype PKCS12 \
              -alias nasbak -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass nasbak123 -keypass nasbak123 \
              -dname "CN=Pantry, OU=Home, O=Pantry, L=Feicheng, ST=Shandong, C=CN"
          fi
          ls -la apps/keystore/

      # 第三方静态程序（aria2c / curl / AriaNg）固定 tag + SHA256 校验后落盘，
      # 二进制不入库；本地离线构建可设 PANTRY_BIN_CACHE 指向缓存目录。
      - name: Fetch native tools
        run: python3 apps/server/fetch-tools.py

      # 服务端 APK 里要带脚本和页面，否则装上去只有个空壳。
      # 这个 zip 不入库，每次构建现打，保证 APK 里的脚本就是当次提交的版本。
      - name: Build server runtime zip
        run: python3 apps/server/pack-assets.py

      - name: Build both APKs
        working-directory: apps
        run: gradle :client:assembleDebug :server:assembleDebug --no-daemon --stacktrace

      - name: Show output
        run: |
          ls -la apps/client/build/outputs/apk/debug/
          ls -la apps/server/build/outputs/apk/debug/

      # 静默丢过一次：禁用 strip 任务后 AGP 构建照样 success，
      # 但 APK 里一个 lib/ 都没有。所以在上传前强制核一遍内置程序在包里。
      - name: Verify server APK payload
        run: |
          python3 - <<'PY'
          import glob, io, zipfile
          apk = glob.glob('apps/server/build/outputs/apk/debug/*.apk')[0]
          z = zipfile.ZipFile(apk)
          names = z.namelist()
          libs = [n for n in names if n.startswith('lib/')]
          print('APK:', apk, '大小', round(len(open(apk,'rb').read())/1048576, 2), 'MB')
          print('lib/ 条目:', libs)
          for want in ('libaria2c.so', 'libcurl.so'):
              assert any(want in n for n in libs), '!! ' + want + ' 没打进 APK'
          assert 'assets/runtime.zip' in names, '!! 缺 runtime.zip'
          rz = zipfile.ZipFile(io.BytesIO(z.read('assets/runtime.zip')))
          rn = rz.namelist()
          for want in ('www/ariang/index.html', 'srv/aria2.sh', 'www/files.html'):
              assert want in rn, '!! runtime.zip 缺 ' + want
          print('校验通过：内置二进制 + AriaNg + 磁力库 + 文件管理页齐全')
          PY

      - name: Upload client APK
        uses: actions/upload-artifact@v4
        with:
          name: pantry-client-${{ github.run_number }}
          path: apps/client/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload server APK
        uses: actions/upload-artifact@v4
        with:
          name: pantry-server-${{ github.run_number }}
          path: apps/server/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 首次初始化用：把 CI 生成的密钥库导出，回填进仓库后签名就固定了。
      - name: Export signing keystore
        run: cp apps/keystore/nasbak.p12 "$GITHUB_WORKSPACE/signing-keystore.p12"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: signing-keystore.p12
          retention-days: 5
